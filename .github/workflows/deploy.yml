
name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace server

      - name: Build application
        run: npm run build

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf -

      - name: Update server source and dependencies
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"$EC2_HOST" <<'REMOTE'
            set -e
            cd /var/www/seizetheday
            git fetch origin master
            git reset --hard origin/master
            npm ci
            npm run prisma:generate --workspace server
          REMOTE

      - name: Transfer production builds
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/dist/ \
            deploy@"$EC2_HOST":/var/www/seizetheday/server/dist/

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            client/dist/ \
            deploy@"$EC2_HOST":/var/www/seizetheday/client/dist/

      - name: Restart application
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"$EC2_HOST" <<'REMOTE'
            sudo -n systemctl restart seizetheday

            # Fail the deploy, with the service's recent log, if it doesn't
            # come back healthy instead of reporting a green check.
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:4000/health; then
                echo
                exit 0
              fi
              sleep 2
            done
            echo "seizetheday did not become healthy after restart" >&2
            sudo -n journalctl -u seizetheday -n 40 --no-pager || true
            exit 1
          REMOTE
